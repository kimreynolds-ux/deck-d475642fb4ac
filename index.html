<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var f=document.getElementById('f'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), m=document.getElementById('m');
  function b64(s){var r=atob(s),a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!window.crypto||!crypto.subtle){m.className='msg';m.textContent=
      'This browser cannot open the deck. Try Chrome, Edge, Safari or Firefox over https.';return;}
    go.disabled=true; m.className='msg work'; m.textContent='Unlocking\u2026';
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw',enc.encode(pw.value),{name:'PBKDF2'},false,['deriveKey'])
     .then(function(base){
       return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},
         base,{name:'AES-GCM',length:256},false,['decrypt']);})
     .then(function(key){
       return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));})
     .then(function(buf){
       var html=new TextDecoder().decode(buf);
       var url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
       document.getElementById('gate').style.display='none';
       var fr=document.getElementById('frame'); fr.style.display='block'; fr.src=url;
       document.body.style.overflow='hidden';})
     .catch(function(){
       go.disabled=false; m.className='msg'; m.textContent='That passcode is not correct.';
       pw.select();});
  });
})();
</script></body></html>
